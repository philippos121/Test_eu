# Legal information sources per EU member state
# Ordered by priority (official government sources first)
# Format: domain -> { name, type: official|portal|academic, language }

eu_wide:
  - domain: eur-lex.europa.eu
    name: EUR-Lex
    type: official
    language: multi
  - domain: e-justice.europa.eu
    name: European e-Justice Portal
    type: official
    language: multi
  - domain: curia.europa.eu
    name: CJEU Case Law
    type: official
    language: multi

