<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EU-Bagatellverfahren Portal — geringfügige Forderungen nach VO 861/2007">

  <!-- iOS PWA meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EU-Klagen">
  <meta name="theme-color" content="#003399">

  <!-- Viewport for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png">

  <!-- Apple touch icons (needed for "Add to Home Screen" on iPhone) -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- iOS splash screens -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <title>EU-Bagatellverfahren</title>

  <style>
    /* Prevent flash of unstyled content / white screen on load */
    body {
      background-color: #003399;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Loading spinner shown before Flutter initialises */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #003399;
      z-index: 9999;
    }

    #loading .star {
      font-size: 56px;
      animation: pulse 1.6s ease-in-out infinite;
    }

    #loading p {
      color: rgba(255,255,255,0.75);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      margin-top: 20px;
      letter-spacing: 0.5px;
    }

    @keyframes pulse {
      0%   { transform: scale(1);    opacity: 1;   }
      50%  { transform: scale(1.12); opacity: 0.7; }
      100% { transform: scale(1);    opacity: 1;   }
    }
  </style>
</head>
<body>
  <!-- Splash shown while Flutter engine loads -->
  <div id="loading">
    <span class="star">⭐</span>
    <p>EU-Bagatellverfahren wird geladen…</p>
  </div>

  <script>
    // Remove the loading splash once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.transition = 'opacity 0.4s ease';
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 450);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
