<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Shield shape -->
  <path d="M24 2L6 10v12c0 11.1 7.7 21.5 18 24 10.3-2.5 18-12.9 18-24V10L24 2z" fill="url(#shield-grad)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <!-- EU stars circle (simplified 6 stars) -->
  <g fill="#FFD700" opacity="0.9">
    <circle cx="24" cy="10" r="1.4"/>
    <circle cx="29.1" cy="12.5" r="1.4"/>
    <circle cx="29.1" cy="17.5" r="1.4"/>
    <circle cx="24" cy="20" r="1.4"/>
    <circle cx="18.9" cy="17.5" r="1.4"/>
    <circle cx="18.9" cy="12.5" r="1.4"/>
  </g>
  <!-- Scales of justice -->
  <g stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- Pillar -->
    <line x1="24" y1="22" x2="24" y2="38"/>
    <!-- Base -->
    <line x1="19" y1="38" x2="29" y2="38"/>
    <!-- Beam -->
    <line x1="14" y1="27" x2="34" y2="27"/>
    <!-- Left pan strings -->
    <line x1="14" y1="27" x2="16" y2="33"/>
    <line x1="14" y1="27" x2="12" y2="33"/>
    <!-- Right pan strings -->
    <line x1="34" y1="27" x2="36" y2="33"/>
    <line x1="34" y1="27" x2="32" y2="33"/>
  </g>
  <!-- Left pan -->
  <path d="M11 33 Q14 36 17 33" stroke="#fff" stroke-width="1.6" fill="rgba(255,255,255,0.15)" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M31 33 Q34 36 37 33" stroke="#fff" stroke-width="1.6" fill="rgba(255,255,255,0.15)" stroke-linecap="round"/>
  <defs>
    <linearGradient id="shield-grad" x1="6" y1="2" x2="42" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2c5f8a"/>
    </linearGradient>
  </defs>
</svg>
